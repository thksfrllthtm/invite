<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тебе приглашение 💌</title>
<meta property="og:title" content="Тебе приглашение 💌">
<meta property="og:description" content="Открой, это очень важно">
<meta name="theme-color" content="#14061c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4d8d;--pink2:#ff8fb8;--violet:#a855f7;--text:#fff;--muted:rgba(255,255,255,.72);--glass:rgba(255,255,255,.08);--border:rgba(255,255,255,.18);--bg:#14061c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

/* живой фон */
.bg{position:fixed;inset:-20%;z-index:0;filter:blur(30px);animation:drift 16s ease-in-out infinite alternate;
  background:radial-gradient(40% 40% at 20% 30%,#ff4d8d60,transparent 70%),radial-gradient(45% 45% at 80% 70%,#8b5cf660,transparent 70%),radial-gradient(30% 30% at 65% 15%,#ff8a5c40,transparent 70%),radial-gradient(30% 30% at 30% 85%,#ec489950,transparent 70%)}
@keyframes drift{to{transform:translate(6%,-5%) rotate(10deg) scale(1.12)}}
canvas{position:fixed;inset:0;z-index:1;pointer-events:none}
main{position:relative;z-index:2;height:100%;overflow-y:auto;overflow-x:hidden;display:grid;grid-template-columns:minmax(0,1fr);padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}

/* экраны */
.screen{grid-area:1/1;margin:auto;width:min(440px,100%);display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(40px) scale(.94);filter:blur(8px);
  transition:opacity .7s,transform .8s cubic-bezier(.2,.9,.2,1),filter .7s,visibility .7s}
.screen.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none}

.card{width:100%;padding:32px 22px;border-radius:28px;background:var(--glass);border:1px solid var(--border);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px #0009,inset 0 1px 0 #fff3;
  display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;overflow:hidden;isolation:isolate}
.card::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 70%,#ff4d8d55 80%,transparent 90%);animation:spin 6s linear infinite;z-index:-1}
.card::after{content:"";position:absolute;inset:1px;border-radius:27px;background:#1d0a2acc;z-index:-1}
@keyframes spin{to{transform:rotate(1turn)}}

h1{font-family:"Marck Script",cursive;font-weight:400;font-size:clamp(40px,11vw,60px);line-height:1.05;
  background:linear-gradient(90deg,#fff 0%,#ffb3cf 30%,#fff 50%,#ffb3cf 70%,#fff 100%);background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite;min-height:1.05em}
@keyframes shimmer{to{background-position:-200% center}}
h2{font-size:clamp(22px,6vw,28px);font-weight:900;line-height:1.2}
.muted{color:var(--muted);font-size:16px}
.caret::after{content:"|";-webkit-text-fill-color:#ffb3cf;animation:blink .8s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

.rv{opacity:0;transform:translateY(16px);transition:opacity .6s,transform .6s cubic-bezier(.2,.9,.2,1)}
.rv.in{opacity:1;transform:none}
.rv:not(.in){pointer-events:none}

.emoji{font-size:64px;line-height:1;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 8px 20px #ff4d8d80)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}

/* кнопки */
.btns{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:64px}
.btn{font:inherit;font-weight:900;font-size:18px;border:0;border-radius:999px;padding:16px 30px;cursor:pointer;color:#fff;
  transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s,opacity .3s}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.yes{background:linear-gradient(135deg,#ff4d8d,#a855f7);box-shadow:0 10px 30px #ff4d8d70,inset 0 1px 0 #fff5;position:relative;overflow:hidden}
.yes::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#fff7 50%,transparent 70%);transform:translateX(-120%);animation:gloss 2.6s ease-in-out infinite}
@keyframes gloss{60%,100%{transform:translateX(120%)}}
.yes:hover{box-shadow:0 14px 40px #ff4d8daa}
.yes:disabled{opacity:.4;cursor:default;filter:grayscale(.5)}
.yes:disabled::after{display:none}
.no{background:#ffffff1f;border:1px solid var(--border);backdrop-filter:blur(6px)}
.no.flee{position:fixed;z-index:10;transition:left .35s cubic-bezier(.3,1.4,.5,1),top .35s cubic-bezier(.3,1.4,.5,1),transform .3s}

/* конверт */
.env{position:relative;width:280px;height:180px;border:0;background:none;cursor:pointer;perspective:900px;animation:float 3s ease-in-out infinite;margin:70px 0 10px}
@keyframes float{50%{transform:translateY(-12px) rotate(-2deg)}}
.env>span{position:absolute}
.env-back{inset:0;border-radius:14px;background:linear-gradient(160deg,#ff6b9d,#c2185b);box-shadow:0 25px 60px #ff4d8d55}
.letter{left:16px;right:16px;top:10px;height:150px;border-radius:10px;background:linear-gradient(#fffaf5,#ffe4ec);z-index:1;
  display:grid;place-items:center;font-size:44px;transition:transform .9s .45s cubic-bezier(.2,.9,.2,1)}
.env-front{inset:0;z-index:2;border-radius:14px;background:linear-gradient(200deg,#ff85b1,#e91e63);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.flap{left:0;right:0;top:0;height:110px;z-index:3;background:linear-gradient(#ff9ec1,#f06292);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .6s,z-index 0s .3s;border-radius:14px 14px 0 0}
.seal{left:50%;top:88px;width:46px;height:46px;margin-left:-23px;z-index:4;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a7a,#b0002a);
  color:#ffd1dc;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 12px #0006;transition:transform .4s,opacity .4s;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.15)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
.env.open{animation:none}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .seal{transform:scale(0);opacity:0;animation:none}
.env.open .letter{transform:translateY(-95px)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}

/* выбор */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.act{font:inherit;color:#fff;background:#ffffff12;border:1px solid var(--border);border-radius:18px;padding:12px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:700;line-height:1.15;transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s,border-color .25s}
.act b{font-size:28px;font-weight:400;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.act:hover{transform:translateY(-4px)}
.act.sel{background:linear-gradient(135deg,#ff4d8d55,#a855f755);border-color:#ff8fb8;box-shadow:0 0 0 2px #ff8fb8,0 10px 30px #ff4d8d60}
.act.sel b{transform:scale(1.25) rotate(-8deg)}
.pick{width:100%;text-align:left}
.pick-title{font-size:14px;font-weight:700;color:var(--muted);margin:0 0 4px 4px}
.scroller{position:relative;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:8px 18px 12px;margin:0 -18px;
  -webkit-mask:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent);mask:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 22px),transparent)}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:center;font:inherit;color:#fff;background:#ffffff12;border:1px solid var(--border);border-radius:18px;cursor:pointer;
  transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s,border-color .25s}
.chip:active{transform:scale(.94)}
.chip.day{width:68px;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.chip.day small{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chip.day b{font-size:24px;font-weight:900;line-height:1.15}
.chip.time{padding:14px 18px;font-size:17px;font-weight:900}
.chip.sel{background:linear-gradient(135deg,#ff4d8d,#a855f7);border-color:transparent;box-shadow:0 8px 22px #ff4d8d70,inset 0 1px 0 #fff5;transform:translateY(-3px)}
.chip.sel small{color:#fff}

/* билет */
.tilt{perspective:1000px;width:100%;filter:drop-shadow(0 30px 50px #ff4d8d55) drop-shadow(0 10px 20px #0008)}
.ticket{position:relative;color:#2a0f2e;border-radius:22px;overflow:hidden;transform-style:preserve-3d;transition:transform .15s ease-out;
  background:linear-gradient(160deg,#fff7fa,#ffe1ec 60%,#f5d0ff);
  -webkit-mask:radial-gradient(circle 15px at 0 calc(100% - 96px),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% calc(100% - 96px),#0000 97%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 15px at 0 calc(100% - 96px),#0000 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 15px at 100% calc(100% - 96px),#0000 97%,#000) right/51% 100% no-repeat}
.screen.on .ticket{animation:drop 1s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{from{transform:translateY(-120px) rotateX(50deg) scale(.8);opacity:0}}
.t-main{padding:24px 22px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.t-head{font-size:11px;letter-spacing:.25em;font-weight:900;color:#c2185b;text-transform:uppercase}
.t-emoji{font-size:64px;line-height:1.1}
.t-act{font-family:"Marck Script",cursive;font-size:44px;line-height:1;color:#c2185b}
.t-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;width:100%;margin-top:10px;text-align:left}
.t-grid small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9d4d7a;font-weight:700}
.t-grid b{font-size:17px;font-weight:900}
.t-stub{height:96px;border-top:2px dashed #e7a3c0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:0 18px}
.barcode{width:80%;height:40px;background:repeating-linear-gradient(90deg,#2a0f2e 0 2px,transparent 2px 4px,#2a0f2e 4px 5px,transparent 5px 8px,#2a0f2e 8px 11px,transparent 11px 13px)}
.t-stub small{font-size:12px;letter-spacing:.3em;font-weight:700;color:#9d4d7a}
.stamp{position:absolute;right:14px;top:58px;padding:6px 12px;border:3px solid #e11d48;border-radius:10px;color:#e11d48;font-weight:900;font-size:18px;
  letter-spacing:.08em;transform:rotate(-14deg);opacity:0}
.screen.on .stamp{animation:slam .45s 1.1s cubic-bezier(.5,0,.6,1.4) forwards}
@keyframes slam{from{transform:rotate(-14deg) scale(3.5);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.85}}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,#ffffffb0 50%,transparent 65%);background-size:250% 100%;animation:sweep 3.5s ease-in-out infinite;mix-blend-mode:soft-light}
@keyframes sweep{from{background-position:150% 0}60%,to{background-position:-100% 0}}

@media (max-width:380px){.card{padding:26px 14px}.acts{gap:7px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fx"></canvas>

<main>
  <!-- 1. Конверт -->
  <section class="screen on" id="s-env">
    <p class="muted" id="envFor">Тебе письмо</p>
    <button class="env" id="env" aria-label="Открыть письмо">
      <span class="env-back"></span>
      <span class="letter">💌</span>
      <span class="env-front"></span>
      <span class="flap"></span>
      <span class="seal">❤</span>
    </button>
    <p class="muted pulse">нажми, чтобы открыть</p>
  </section>

  <!-- 2. Вопрос -->
  <section class="screen" id="s-ask">
    <div class="card">
      <div class="emoji" id="face">🥺</div>
      <h1 id="hello"></h1>
      <p class="muted rv" id="sub">У меня к тебе очень важный вопрос…</p>
      <h2 class="rv">Пойдёшь со мной на свидание?</h2>
      <div class="btns rv">
        <button class="btn yes" id="yes">Да, конечно 💖</button>
        <button class="btn no" id="no">Нет</button>
      </div>
    </div>
  </section>

  <!-- 3. План -->
  <section class="screen" id="s-plan">
    <div class="card">
      <h1>Ура! 🎉</h1>
      <p class="muted">Осталось выбрать, куда и когда</p>
      <div class="acts" id="acts"></div>
      <div class="pick"><p class="pick-title">📅 Когда</p><div class="scroller" id="days"></div></div>
      <div class="pick"><p class="pick-title">🕖 Во сколько</p><div class="scroller" id="times"></div></div>
      <button class="btn yes" id="go" disabled>Получить билет 🎟</button>
    </div>
  </section>

  <!-- 4. Билет -->
  <section class="screen" id="s-ticket">
    <div class="tilt">
      <div class="ticket" id="ticket">
        <div class="t-main">
          <div class="t-head">Билет на свидание</div>
          <div class="t-emoji" id="tEmoji"></div>
          <div class="t-act" id="tAct"></div>
          <div class="t-grid">
            <div><small>Когда</small><b id="tDate"></b></div>
            <div><small>Время</small><b id="tTime"></b></div>
            <div><small>Гость</small><b id="tName"></b></div>
            <div><small>Место</small><b>рядом со мной</b></div>
          </div>
        </div>
        <div class="t-stub"><div class="barcode"></div><small id="tNo"></small></div>
        <div class="stamp">ПРИНЯТО ❤</div>
        <div class="shine"></div>
      </div>
    </div>
    <p class="muted">Сделай скриншот — это твой билет 💌</p>
  </section>
</main>

<script>
// Уведомления в Telegram — необязательно. Оставь пустым, чтобы выключить.
// Внимание: токен будет виден в коде страницы. Создай отдельного бота только под это.
const TG_TOKEN = '';
const TG_CHAT = '';

const ACTIVITIES = [['🍝','Ужин'],['🎬','Кино'],['🌙','Прогулка'],['☕','Кофе'],['🎳','Боулинг'],['🐎','Конная прогулка']];
const NO_TEXTS = ['Нет','Точно нет?','Подумай ещё 🥺','Ну пожалуйста','Я расстроюсь 😢','Последний шанс!','Не поймаешь 😜','Кнопка сломалась 🙃'];
const FACES = ['🥺','😳','😢','🙏','😭','🥹','💔','😵‍💫'];

const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.random() * a.length | 0];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
const NAME = (params.get('name') || '').trim().slice(0, 30);
const FROM = (params.get('from') || '').trim().slice(0, 30);

function notify(text) {
  if (!TG_TOKEN || !TG_CHAT) return;
  const who = NAME ? ` (${NAME})` : '';
  fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage?chat_id=${encodeURIComponent(TG_CHAT)}&text=${encodeURIComponent(text + who)}`, {mode: 'no-cors'}).catch(() => {});
}

function show(id) {
  document.querySelector('.screen.on')?.classList.remove('on');
  setTimeout(() => { $(id).classList.add('on'); document.querySelector('main').scrollTop = 0; }, 300);
}

function type(el, text, speed = 60) {
  el.classList.add('caret');
  return new Promise(done => {
    let i = 0;
    const t = setInterval(() => {
      el.textContent = text.slice(0, ++i);
      if (i >= text.length) { clearInterval(t); setTimeout(() => el.classList.remove('caret'), 600); done(); }
    }, speed);
  });
}

/* ---------- частицы: сердечки фона, искры, конфетти ---------- */
const cv = $('fx'), ctx = cv.getContext('2d');
let W, H;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

const COLORS = ['#ff4d8d','#ff8fb8','#ffc2d9','#c084fc','#fb7185','#ffffff','#f472b6'];
const P = [];

// классическая кривая сердца, размер ≈ 1×1
const HEART = new Path2D();
for (let t = 0; t <= Math.PI * 2; t += .1)
  HEART.lineTo(16 * Math.sin(t) ** 3 / 32, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 32);

function heart(x, y, s, r, c, a) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(r); ctx.scale(s, s);
  ctx.globalAlpha = a; ctx.fillStyle = c;
  ctx.fill(HEART);
  ctx.restore();
}

const bgHeart = y => ({k: 'bg', x: rnd(0, W), y: y ?? H + 30, vx: rnd(-.2, .2), vy: rnd(-.3, -1), s: rnd(10, 26), r: rnd(-.4, .4), vr: rnd(-.01, .01), a: rnd(.15, .5), c: pick(COLORS), ph: rnd(0, 6.3)});
for (let i = 0; i < (reduce ? 8 : 30); i++) P.push(bgHeart(rnd(0, H)));

function burst(x, y, n = 120) {
  if (reduce) n = 30;
  for (let i = 0; i < n; i++) {
    const ang = rnd(0, Math.PI * 2), sp = rnd(3, 13);
    P.push({k: 'cf', x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 4, s: rnd(8, 20), r: rnd(0, 6.3), vr: rnd(-.2, .2), a: 1, c: pick(COLORS), life: rnd(90, 170), heart: Math.random() < .6});
  }
}
function rain(n = 80) {
  for (let i = 0; i < n; i++)
    P.push({k: 'cf', x: rnd(0, W), y: rnd(-H * .6, -20), vx: rnd(-1, 1), vy: rnd(1, 4), s: rnd(10, 22), r: rnd(0, 6.3), vr: rnd(-.1, .1), a: 1, c: pick(COLORS), life: 260, heart: true});
}
function fireworks() {
  burst(W / 2, H / 2, 160);
  setTimeout(() => burst(W * .2, H * .35, 90), 250);
  setTimeout(() => burst(W * .8, H * .3, 90), 450);
  setTimeout(() => rain(70), 700);
}

addEventListener('pointermove', e => {
  if (reduce || P.length > 700) return;
  for (let i = 0; i < 2; i++)
    P.push({k: 'sp', x: e.clientX, y: e.clientY, vx: rnd(-1.2, 1.2), vy: rnd(-1.5, .5), s: rnd(1.5, 3.5), a: 1, c: pick(COLORS), life: rnd(30, 55)});
});

(function loop() {
  ctx.clearRect(0, 0, W, H);
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    if (p.k === 'bg') {
      p.ph += .02; p.x += p.vx + Math.sin(p.ph) * .35; p.y += p.vy; p.r += p.vr;
      if (p.y < -40) { P[i] = bgHeart(); continue; }
      ctx.shadowBlur = 18; ctx.shadowColor = p.c;
      heart(p.x, p.y, p.s, p.r, p.c, p.a);
      continue;
    }
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.k === 'cf') { p.vy += .22; p.vx *= .985; p.vy *= .985; p.r += p.vr; p.a = Math.min(1, p.life / 40); }
    else { p.vy += .03; p.a = p.life / 55; }
    if (p.life <= 0 || p.y > H + 60) { P.splice(i, 1); continue; }
    ctx.shadowBlur = p.k === 'sp' ? 8 : 0; ctx.shadowColor = p.c;
    if (p.k === 'sp') {
      ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
    } else if (p.heart) heart(p.x, p.y, p.s, p.r, p.c, p.a);
    else {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
})();

/* звук «динь-динь» без файлов */
function chime() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .12;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .6);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .65);
    });
  } catch {}
}

/* ---------- 1. Конверт ---------- */
if (NAME) $('envFor').textContent = `${NAME}, тебе письмо`;
$('env').addEventListener('click', () => {
  const env = $('env');
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  const r = env.getBoundingClientRect();
  setTimeout(() => burst(r.left + r.width / 2, r.top + 20, 60), 700);
  notify('💌 Приглашение открыто');
  setTimeout(async () => {
    show('s-ask');
    await new Promise(r => setTimeout(r, 700));
    if (FROM) $('sub').textContent = `${FROM} хочет кое-что спросить…`;
    await type($('hello'), NAME ? `${NAME}, привет!` : 'Привет!');
    document.querySelectorAll('#s-ask .rv').forEach((el, i) => setTimeout(() => el.classList.add('in'), 250 + i * 450));
  }, 1600);
});

/* ---------- 2. Убегающее «Нет» ---------- */
const no = $('no'), yes = $('yes');
let tries = 0;
function flee(e) {
  e?.preventDefault?.();
  tries++;
  no.textContent = NO_TEXTS[Math.min(tries, NO_TEXTS.length - 1)];
  $('face').textContent = FACES[tries % FACES.length];
  if (!no.classList.contains('flee')) {
    // backdrop-filter у карточки ломает position:fixed — выносим кнопку в body
    const r = no.getBoundingClientRect();
    document.body.appendChild(no);
    no.classList.add('flee');
    no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
    no.offsetWidth; // зафиксировать стартовую позицию для анимации
  }
  const r = no.getBoundingClientRect(), pad = 16;
  let x, y, n = 0;
  do { x = rnd(pad, W - r.width - pad); y = rnd(pad, H - r.height - pad); }
  while (Math.hypot(x - r.left, y - r.top) < 140 && ++n < 25);
  no.style.left = x + 'px'; no.style.top = y + 'px';
  no.style.transform = `scale(${Math.max(.55, 1 - tries * .05)}) rotate(${rnd(-15, 15)}deg)`;
  yes.style.transform = `scale(${Math.min(1.7, 1 + tries * .1)})`;
  navigator.vibrate?.(15);
}
no.addEventListener('pointerenter', e => e.pointerType === 'mouse' && flee(e));
no.addEventListener('pointerdown', flee);
no.addEventListener('click', flee);

yes.addEventListener('click', () => {
  no.remove();
  yes.style.transform = 'scale(1.15)';
  fireworks(); chime();
  navigator.vibrate?.([30, 50, 30]);
  notify(`💖 Ответ: ДА!${tries ? ` (до этого пытались нажать «Нет» ${tries} раз 😅)` : ''}`);
  setTimeout(() => show('s-plan'), 900);
});

/* ---------- 3. План ---------- */
let act = null;
const acts = $('acts');
ACTIVITIES.forEach(([emo, label]) => {
  const b = document.createElement('button');
  b.className = 'act';
  b.innerHTML = '<b></b><span></span>';
  b.firstChild.textContent = emo; b.lastChild.textContent = label;
  b.addEventListener('click', () => {
    acts.querySelector('.sel')?.classList.remove('sel');
    b.classList.add('sel'); act = [emo, label];
    const r = b.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, 18);
    check();
  });
  acts.appendChild(b);
});

let date = null, time = '19:00';
const check = () => { $('go').disabled = !(act && date && time); };

function chips(el, cls, items, pick) {
  for (const [value, html] of items) {
    const b = document.createElement('button');
    b.className = 'chip ' + cls;
    b.innerHTML = html;
    b.addEventListener('click', () => {
      el.querySelector('.sel')?.classList.remove('sel');
      b.classList.add('sel');
      el.scrollTo({left: b.offsetLeft - el.clientWidth / 2 + b.offsetWidth / 2, behavior: 'smooth'});
      pick(value); check();
    });
    el.appendChild(b);
  }
  // колесо мыши листает вбок (на ПК)
  el.addEventListener('wheel', e => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { el.scrollLeft += e.deltaY; e.preventDefault(); }
  }, {passive: false});
}

const days = Array.from({length: 21}, (_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i); return d; });
chips($('days'), 'day', days.map((d, i) => [d,
  `<small>${i === 0 ? 'сегодня' : i === 1 ? 'завтра' : d.toLocaleDateString('ru-RU', {weekday: 'short'})}</small><b>${d.getDate()}</b><small>${d.toLocaleDateString('ru-RU', {month: 'short'}).replace('.', '')}</small>`
]), v => date = v);

const times = [];
for (let m = 10 * 60; m <= 23 * 60; m += 30) times.push(String(m / 60 | 0).padStart(2, '0') + ':' + (m % 60 ? '30' : '00'));
chips($('times'), 'time', times.map(t => [t, t]), v => time = v);
const t19 = [...$('times').children].find(b => b.textContent === time);
t19.classList.add('sel');
$('times').scrollLeft = t19.offsetLeft - $('times').clientWidth / 2 + t19.offsetWidth / 2;

// Ответ сохраняется в браузере: при повторном заходе сразу открывается билет
const SAVE_KEY = 'date-ticket:' + NAME + ':' + FROM;

function fillTicket(t) {
  $('tEmoji').textContent = t.emoji;
  $('tAct').textContent = t.act;
  $('tDate').textContent = t.date;
  $('tTime').textContent = t.time;
  $('tName').textContent = NAME || 'Ты 💕';
  $('tNo').textContent = t.no;
}

$('go').addEventListener('click', () => {
  const t = {
    emoji: act[0], act: act[1], time,
    date: date.toLocaleDateString('ru-RU', {weekday: 'short', day: 'numeric', month: 'long'}),
    no: '№ ' + String(Math.random() * 1e6 | 0).padStart(6, '0'),
  };
  fillTicket(t);
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(t)); } catch {}
  notify(`🎟 Выбрано: ${t.emoji} ${t.act}, ${t.date}, ${t.time}`);
  show('s-ticket');
  setTimeout(() => { fireworks(); chime(); }, 1500);
});

try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (saved) {
    fillTicket(saved);
    $('s-env').classList.remove('on');
    $('s-ticket').classList.add('on');
    setTimeout(fireworks, 900);
  }
} catch {}

/* ---------- 4. Билет: 3D-наклон ---------- */
const ticket = $('ticket');
addEventListener('pointermove', e => {
  if (!$('s-ticket').classList.contains('on') || reduce) return;
  const x = e.clientX / W - .5, y = e.clientY / H - .5;
  ticket.style.transform = `rotateY(${x * 18}deg) rotateX(${-y * 14}deg)`;
});
</script>
</body>
